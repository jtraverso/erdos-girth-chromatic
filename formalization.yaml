# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Graphs of large girth and large chromatic number: Erdős, Mycielski, and the fractional chromatic number of Mycielski graphs"
  description: >-
    A Lean 4 / Mathlib formalization of three classical results on graphs with large chromatic
    number. (1) Erdős' 1959 theorem: for every g and k there is a finite graph with girth greater
    than g and chromatic number greater than k, in the structural form given by the probabilistic
    argument (for every ε > 0 and all large n, a graph on n vertices with girth greater than g whose
    independent sets have fewer than εn vertices). (2) Mycielski's 1955 construction M(G): it
    preserves and reflects triangle-freeness, M(G) is (k+1)-colourable exactly when G is
    k-colourable, χ(M(G)) = χ(G) + 1 for every finite G, and iterating from K₂ gives triangle-free
    graphs with 3·2ⁿ − 1 vertices and chromatic number n + 2. (3) Larsen, Propp and Ullman (1995):
    for the fractional chromatic number χ_f (least total weight of a fractional colouring by
    independent sets), χ_f(M(G)) = χ_f(G) + 1/χ_f(G) for every finite graph G with at least one
    vertex. Version 2 adds (2) and (3); the statements of version 1 are unchanged. Mathlib has
    girth and chromatic number but none of these theorems, and no fractional chromatic number.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C15", "05C38", "05C80", "05C72"]

sources:
  - title: "Graph Theory and Probability"
    authors:
      - "Paul Erdős"
    id: "doi:10.4153/CJM-1959-003-9"
    type: "paper"
    location: "Canadian Journal of Mathematics 11 (1959), 34–38"
    relationship: "formalizes"
    note: >-
      The existence of graphs with girth > g and chromatic number > k, in the structural form
      (independence number < εn) obtained from Erdős's probabilistic argument with random graphs
      of edge probability p = n^(θ − 1), θ < 1/g, and deletion of one vertex per short cycle.
    license: "all rights reserved"
    author_endorsement: "n/a"

  - title: "Sur le coloriage des graphs"
    authors:
      - "Jan Mycielski"
    id: "doi:10.4064/cm-3-2-161-162"
    type: "paper"
    location: "Colloquium Mathematicum 3 (1955), 161–162"
    relationship: "formalizes"
    note: >-
      The construction and its triangle-free, unbounded-chromatic-number consequence. The palette
      equivalence, the reflection of triangle-freeness and the size formulas are accompanying
      statements proved here, not individually numbered results of the paper. The existence of
      triangle-free graphs of prescribed chromatic number from Mycielski's construction is also
      registered by another author (PALOMAR-2026-10-14-000006, AItoBit/erdos-627-palomar); this
      entry adds the general statements for every finite graph and the fractional chromatic number.
    license: "all rights reserved"
    author_endorsement: "n/a"
  - title: "The fractional chromatic number of Mycielski's graphs"
    authors:
      - "Michael Larsen"
      - "James Propp"
      - "Daniel Ullman"
    id: "doi:10.1002/jgt.3190190313"
    type: "paper"
    location: "Journal of Graph Theory 19 (1995), 411–416"
    relationship: "formalizes"
    note: >-
      The identity χ_f(M(G)) = χ_f(G) + 1/χ_f(G). The upper bound uses the explicit fractional
      colouring of the paper; the lower bound uses an optimal fractional clique (finite LP strong
      duality) and weak duality on G minus the closed neighbourhood of an independent set.
    license: "all rights reserved"
    author_endorsement: "not-contacted"

status:
  scope: >-
    Erdős: proved for every g, every ε > 0 (respectively every k) and all sufficiently large n,
    with explicit (non-asymptotic) parameters inside the proof; the existence statement holds for
    every g and k. Mycielski: for every graph (finite where chromatic numbers are compared).
    Larsen–Propp–Ullman: for every finite graph with at least one vertex (for the empty graph
    χ_f = 0 and the identity fails).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "autonomous"
      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI"
      tool_setup: >-
        Produced all proofs in one run from the formal statements and a proof plan; the return was
        audited (statements and headers unchanged, no added axioms) and rebuilt locally.
      cost:
        wall_time: "about one hour"
        spend_usd: "not tracked"
        hardware: "API-only"
      prompting_notes: "Formal statements and proof plan supplied."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Statement design, proof plan, integration and review of the Aristotle return, and the
        Palomar packaging, checked with `lake build` and `#print axioms` (Lean v4.35.0-rc3,
        Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "about one hour"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
    - method: "agent"
      models: ["OpenAI Codex"]
      framework: "OpenAI Codex"
      tool_setup: >-
        Version 2, Mycielski part: wrote the Mycielski definitions, Lean proofs and audit in the
        author's separate repository jtraverso/mycielski, merged here unchanged.
      prompting_notes: "Natural-language instructions in Spanish from the author."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Version 2, fractional part: definitions of fractional colourings and cliques, weak and
        strong duality and the Larsen–Propp–Ullman proof (FractionalLib/), written and checked
        locally with Lean v4.35.0-rc3. The finite LP strong duality module
        FractionalLib/FiniteLPDuality.lean is reused byte-identically from the author's Lean
        development of Erdős #81 Paper I (Apache-2.0).
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The results were chosen by the human author; the Lean proofs are AI-generated and
    mechanically verified (no `sorry`, axioms limited to propext, Classical.choice and Quot.sound,
    identical elaborated types for the Challenge/Solution pair).

fidelity:
  divergences: >-
    Graphs are simple graphs on Fin n. "Girth greater than g" is (g : ℕ∞) < G.egirth (Mathlib's
    extended girth, ∞ for acyclic graphs); "chromatic number greater than k" is
    (k : ℕ∞) < G.chromaticNumber, or ¬ G.Colorable k. The independence condition is stated for
    every finset s with G.IsIndepSet s: s.card < ε n. The structural and non-colourability forms
    hold for all n ≥ N for some N depending on g and ε (respectively g and k); the probabilistic
    argument is carried out with explicit finite weighted sums rather than a measure-theoretic
    random graph.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent
    compared the statements with Erdős's theorem, checked that the Aristotle return left every
    statement and header unchanged, and confirmed by `lake build`, `#print axioms` and a
    comparison of the fully elaborated Challenge and Solution types that the proofs use no `sorry`
    and only propext, Classical.choice and Quot.sound. The author directed the work and approved
    the statements. For version 2 the agent also checked that the version 1 statements are
    contained verbatim in the new Challenge, compared the new statements with Mycielski (1955) and
    Larsen–Propp–Ullman (1995), and tested the identity on K₁ (χ_f = 1; M(K₁) is K₂ plus an
    isolated vertex, χ_f = 2) and K₂ (M(K₂) = C₅, χ_f = 5/2). No independent human mathematical
    review has been performed. The results are classical; no mathematical novelty is claimed.

alignment:
  namespace: "ErdosGirthChromatic, Mycielski, FractionalColouring"
  statements:
    - source: "Erdős (1959), structural form: girth > g and independence number < εn"
      lean: "ErdosGirthChromatic.exists_girth_indep"
      module: "Challenge"
      status: "proved"
    - source: "Erdős (1959): girth > g and not k-colourable, for all large n"
      lean: "ErdosGirthChromatic.exists_girth_not_colorable"
      module: "Challenge"
      status: "proved"
    - source: "Erdős (1959): girth > g and chromatic number > k"
      lean: "ErdosGirthChromatic.exists_girth_chromaticNumber"
      module: "Challenge"
      status: "proved"
    - source: "Mycielski (1955): vertex count 2|V| + 1"
      lean: "Mycielski.card_vertex"
      module: "Challenge"
      status: "proved"
    - source: "Mycielski (1955): M(G) triangle-free iff G triangle-free"
      lean: "Mycielski.graph_cliqueFree_three_iff"
      module: "Challenge"
      status: "proved"
    - source: "Mycielski (1955): M(G) is (k+1)-colourable iff G is k-colourable"
      lean: "Mycielski.colorable_succ_iff"
      module: "Challenge"
      status: "proved"
    - source: "Mycielski (1955): χ(M(G)) = χ(G) + 1 for finite G"
      lean: "Mycielski.chromaticNumber_graph"
      module: "Challenge"
      status: "proved"
    - source: "Mycielski family from K₂: 3·2ⁿ − 1 vertices"
      lean: "Mycielski.card_familyVertex"
      module: "Challenge"
      status: "proved"
    - source: "Mycielski family: triangle-free"
      lean: "Mycielski.family_cliqueFree_three"
      module: "Challenge"
      status: "proved"
    - source: "Mycielski family: chromatic number n + 2"
      lean: "Mycielski.family_chromaticNumber"
      module: "Challenge"
      status: "proved"
    - source: "Mycielski (1955): triangle-free graphs of unbounded chromatic number"
      lean: "Mycielski.exists_triangleFree_chromaticNumber_ge"
      module: "Challenge"
      status: "proved"
    - source: "Larsen–Propp–Ullman (1995): χ_f(M(G)) = χ_f(G) + 1/χ_f(G)"
      lean: "FractionalColouring.fracChromaticNumber_mycielski"
      module: "Challenge"
      status: "proved"

acknowledgements: >-
  Mathlib and the Lean community; Harmonic's Aristotle; OpenAI Codex.
