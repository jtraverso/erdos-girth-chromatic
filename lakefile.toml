name = "erdos_girth"
version = "0.1.0"
defaultTargets = ["GirthLib", "Mycielski", "FractionalLib", "Challenge", "Solution"]
requiresModuleSystem = true

[leanOptions]
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "GirthLib"
globs = ["GirthLib.+"]

[[lean_lib]]
name = "Mycielski"
globs = ["Mycielski.+"]

[[lean_lib]]
name = "FractionalLib"
globs = ["FractionalLib.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
